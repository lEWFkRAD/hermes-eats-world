[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-eats-world"
version = "1.0.0"
description = "Hermes Eats World - Windows UI perception and action sidecar"
requires-python = ">=3.10"
dependencies = [
    "uiautomation==2.0.19",
    "mss==10.0.0",
    "Pillow>=10.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
heaw = "sidecar.service.cli:main"

[tool.setuptools.packages.find]
include = ["sidecar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
