[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "hermes-eats-world"
version = "1.0.0"
description = "Hermes Eats World - Windows UI perception and action sidecar"
requires-python = ">=3.10"
dependencies = [
    "uiautomation==2.0.19",
    "mss==10.0.0",
    "Pillow>=10.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "websockets>=12.0",
    "tenacity>=8.0.0",
    "python-json-logger>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.0.0",
]

[project.scripts]
heaw = "sidecar.service.cli:main"
