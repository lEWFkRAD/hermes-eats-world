[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-eats-world"
version = "1.1.0"
description = "Profile-aware, read-only Windows UI perception plugin for Hermes Agent"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
runtime = [
    "uiautomation==2.0.29",
    "mss==10.2.0",
    "Pillow>=10.0.0,<13",
    "pydantic>=2.0.0,<3",
]
dev = [
    "uiautomation==2.0.29",
    "mss==10.2.0",
    "Pillow>=10.0.0,<13",
    "pydantic>=2.0.0,<3",
    "build>=1.2.0,<2",
    "pip-audit>=2.9.0,<3",
    "pytest>=7.0.0,<10",
    "ruff>=0.5.0,<1",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.scripts]
heaw = "sidecar.service.cli:main"

[project.entry-points."hermes_agent.plugins"]
hermes-eats-world = "sidecar.hermes_plugin:register"

[tool.setuptools.packages.find]
include = ["sidecar*"]

[tool.setuptools.package-data]
sidecar = ["runtime-requirements.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
