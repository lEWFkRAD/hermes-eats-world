name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check sidecar scripts tests
      - run: python -m pytest -q
      - run: python -m pip_audit
      - name: Verify tag and version sources
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($tag -ne "v$version") { throw "Tag $tag does not match package v$version" }
          python -m pytest tests/test_release_metadata.py -q
      - run: python -m build --wheel
      - name: Attest wheel provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: dist/*.whl
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.whl --verify-tag --title "Hermes Eats World ${{ github.ref_name }}" --notes-from-tag
