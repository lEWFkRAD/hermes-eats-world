name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check sidecar scripts tests
      - run: python -m pytest -q
      - name: Verify tag and version sources
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($tag -ne "v$version") { throw "Tag $tag does not match package v$version" }
          python -m pytest tests/test_release_metadata.py -q
      - run: python -m build --wheel
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.whl --verify-tag --title "Hermes Eats World ${{ github.ref_name }}" --notes-from-tag
